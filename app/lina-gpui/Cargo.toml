[package]
name = "lina-gpui"
version = "0.0.1"
edition = "2021"
publish = false

# SHELL gpui do Lina (Onda 2): a PONTE real core <-> gpui via `lina_host::UiHost` +
# `InputSink`. Crate standalone, EXCLUÍDO do workspace (raiz `Cargo.toml` `exclude`) —
# um shell experimental não pode derrubar o build do core.
[dependencies]
lina-core = { path = "../../crates/lina-core" }
lina-host = { path = "../../crates/lina-host" }
# W2-4 selection/mouse: o `lina_core` re-exporta o GRID/VtBackend mas NÃO os tipos de mouse
# (MouseEvent/MouseButton/…). Dep direta (path; não modifica o crate) p/ usar `encode_mouse`.
# Mesma instância path do core → os tipos VtScreen/VtBackend unificam (sem conflito).
lina-vt = { path = "../../crates/lina-vt" }
# W3-2: motor de bootstrap turno-0 — gera `<workspace>/CLAUDE.md` (8 blocos) ao criar/mudar nós.
lina-bootstrap = { path = "../../crates/lina-bootstrap" }
# W4-2 (M2 Novo Agente): deriva o PAPEL pelo nome do agente ("Revisor" -> reviewer) via role-discovery.
lina-role-discovery = { path = "../../crates/lina-role-discovery" }
# W3-6c (ADR 0004): cofre de segredos — o broker lê o token daqui p/ executar uma ação custodiada
# (o agente nunca o tem no env). `MockStore` (em memória) na demo; `KeyringStore` em produção.
lina-secrets = { path = "../../crates/lina-secrets" }
# W4-1 (Instalar para mim): receitas de instalação NÃO-interativas por SO vivem em config TOML
# (`profiles/installers/recipes.toml`), nunca hardcoded — neutralidade multi-CLI (CLAUDE.md inv#3).
lina-cli-profiles = { path = "../../crates/lina-cli-profiles" }
# F1-1-5 (dashboard vivo): schema único de sessão (tokens/custo~ por terminal) da camada 3 —
# o card consome `Session` + o match sessão↔nó por cwd (sem chute; doutrina 13.9).
lina-session-watch = { path = "../../crates/lina-session-watch" }
# F1-1-3 (wiring): listener loopback dos hooks de observabilidade — bind 1x no boot;
# token por spawn (atribuição NUNCA pelo payload); a timeline do dashboard drena daqui.
lina-hooks = { path = "../../crates/lina-hooks" }
# F1-4-6 (UX de ativação): gate REAL free=1/PRO=N + ativação por chave colada (ed25519
# local, zero rede) — mata o stub `LicenseTier::Pro` que era bloqueante de release (§6-B1).
lina-license = { path = "../../crates/lina-license" }
# W3-6c Round 5: desserializar `MailMessage` no drain AUTENTICADO por-nó da fila de broker (o app lê
# só os subdirs por-nó, carimbando a origem; rejeita flat) — precisa nomear `serde_json` direto.
serde_json = "1"
# W4-1: persistência retomável do onboarding (`onboarding.json`: passo + escolhas) via derive.
serde = { version = "1", features = ["derive"] }
# W4-2 (M3/M4 criadores): cunhar o NodeId (UUID v7) do nó da nota/pasta em código de PRODUÇÃO
# (antes só dev-dep). Mesma instância do core → o NodeId unifica. Sem mudança no grafo de deps.
uuid = { version = "1", features = ["v7"] }
# Bus do core é `tokio::sync::broadcast` — nomeamos o `Receiver`/`TryRecvError` aqui.
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
# gpui: MESMO SHA auditado + features do spike W1-1 (runtime_shaders dispensa o Metal
# Toolchain offline; ver spikes/spike-gpui/RESULTADO.md §1).
gpui = { git = "https://github.com/zed-industries/zed", rev = "09165c15dc5d1fea93604231eaf30ca4c25f1cd6" }
# gpui_platform: features POR-SO nos blocos [target...] no fim do arquivo — `runtime_shaders` (Metal)
# é macOS-only; Windows/Linux usam o backend do SO (Direct3D/Vulkan) pelas default-features.

[dev-dependencies]
# Só nos testes: cunhar `NodeId` (UUID v7) para exercitar `bus_to_host`.
uuid = { version = "1", features = ["v7"] }
# F1-4-6: ASSINAR chaves de teste (Verifier::with_key) — só verify existe em produção;
# mesma versão/features do dev-deps do lina-license (os tipos precisam unificar).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# === gpui_platform POR-SO ===========================================================
# macOS: runtime_shaders compila shaders Metal em runtime (dispensa o Metal Toolchain offline).
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "09165c15dc5d1fea93604231eaf30ca4c25f1cd6", default-features = false, features = ["font-kit", "runtime_shaders"] }

# Windows/Linux: SEM runtime_shaders (não há Metal). O backend do SO (Direct3D no Windows, Vulkan no
# Linux) vem pelas default-features do gpui_platform. Se a 1ª build Windows reclamar de feature/backend
# ausente, ajuste ESTE bloco (ver a skill `windows-bringup`) — é o ponto que só o compilador valida.
[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "09165c15dc5d1fea93604231eaf30ca4c25f1cd6", features = ["font-kit"] }

# Disco apertado (~5.8 GiB) + a árvore gpui é grande: corta debuginfo (>50% do target),
# como o spike. Não é produto — é o primeiro shell ponta-a-ponta.
[profile.dev]
debug = false
