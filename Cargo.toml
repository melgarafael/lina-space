[workspace]
resolver = "2"
members = [
    "crates/lina-pty",
    "crates/lina-vt",
    "crates/lina-core",
    "crates/lina-host",
    "crates/lina-secrets",
    "crates/lina-cli-profiles",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Rafael Melgaço"]
license = "Proprietary"
repository = "lina-space"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
