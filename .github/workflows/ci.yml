name: CI

# Esteira de qualidade do Lina Space (Fase 0 — Mac-first).
#
# O loop central da Fase 0 está PROVADO e validado na tela no macOS. Esta esteira
# trava a qualidade do core a cada push e faz o backup remoto do código.
#
# Estado dos gates (2026-06-10, F1-6-8 — CI 3-SO real):
#   * core-macos      — gate PRINCIPAL (espelha o canal limpo do Maestro): test + clippy + fmt.
#   * core-linux      — bônus barato; o core é Mac/Linux-verde (W0). Confirma portabilidade do core.
#   * core-windows    — GATE BLOQUEANTE (F1-6-8): o bring-up Windows foi mergeado (8d21f55),
#                       a condição escrita aqui desde a Onda 5 chegou — o job EXECUTA a suíte
#                       (sem --no-run, sem continue-on-error). Triagem teste×SO (o que roda
#                       onde e por quê): tasks/epico-f1/ci-3so-triagem.md — zero skip silencioso.
#   * license-security — W5-5 wire-CI: cargo-deny (licenças) + cargo-audit (RustSec). Verdes localmente.
#   * app-macos       — build/clippy/fmt do shell gpui (standalone, fora do workspace).
#
# PENDENTE (bloco de INFRA do §7 — precisa hardware/certificados do fundador, NÃO ligado aqui):
#   * App gpui no Windows + ConPTY real (W5-3): bring-up nativo validado NA TELA — ver WINDOWS-BRINGUP.md.
#     (o core-windows acima cobre só o core headless; a tela do gpui não roda em CI — exige olho humano.)
#   * Matriz GPU Linux (NVIDIA/AMD/Intel × X11/Wayland) — ver épico W5-3.
#   * E2E visual golden-render 3-SO + assinatura/notarização (W5-6) → conta Apple + Authenticode.
# Os 5 jobs são gates obrigatórios. O que SÓ um run real no GitHub prova (não dá pra provar local):
# duração/estabilidade do core-windows executando (3 runs consecutivos — critério (c) da F1-6-8)
# e o comportamento do runner (PATH, ConPTY, credential store). Checklist: ci-3so-triagem.md §4.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core-macos:
    name: Core (macOS) — gate principal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace, serializado — o store/recovery exige --test-threads=1)
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fmt (por-pacote — fmt --check no nível workspace mascara o exit; ver lição do projeto)
        # F1-6-8 fechou um furo: lina-session-watch/lina-hooks/lina-otel estavam fora da lista
        # (fmt-drift neles passava sem gate). Verificados fmt-limpos antes de entrar.
        run: |
          for c in lina-pty lina-vt lina-core lina-host lina-secrets lina-cli-profiles lina-session-watch lina-role-discovery lina-bootstrap lina-webhooks lina-hooks lina-otel; do
            cargo fmt -p "$c" -- --check
          done

  core-linux:
    name: Core (Linux) — portabilidade do core headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # keyring (lina-secrets) no Linux usa secret-service -> libdbus-sys (FFI), cujo build.rs aborta
      # sem as libs de sistema do D-Bus. macOS/Windows usam apple-native/windows-native (sem dbus).
      - name: Deps de sistema (D-Bus para o keyring/secret-service no Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace, serializado)
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  core-windows:
    name: Core (Windows) — portabilidade do core (x86_64-msvc)
    runs-on: windows-latest
    # GATE BLOQUEANTE desde F1-6-8 (a promoção que este arquivo pedia desde a Onda 5): o bring-up
    # Windows foi mergeado (8d21f55) e a suíte passou a EXECUTAR de verdade — `--no-run` saiu,
    # `continue-on-error` saiu. Os testes runtime-Unix (spawn de `yes`/`sh`, `kill`, semântica de
    # PTY Unix) estão atrás de #[cfg(unix)] com o porquê anotado em cada um; a tabela teste×SO
    # completa (o que roda onde, o que é pendente-windows) vive em tasks/epico-f1/ci-3so-triagem.md.
    # Se este job estourar o timeout, a causa típica é um teste NOVO sem triagem de SO pendurando
    # no ConPTY (histórico: hang de ~70min em flow_control_caps_memory_under_flood) — triague o
    # teste na tabela antes de aumentar o timeout.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # windows-latest do GitHub é x86_64 → toolchain stable resolve x86_64-pc-windows-msvc
      # (exatamente a arquitetura exigida no bring-up). Não há fmt aqui: espelha core-linux.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace, serializado — mesma receita dos gates macOS/Linux)
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  license-security:
    name: Licença + Segurança (W5-5 wire-CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (licenças + bans + sources — usa deny.toml do repo)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit (RustSec — vulnerabilidades conhecidas)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  app-macos:
    name: App gpui (macOS) — shell standalone
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/lina-gpui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/lina-gpui
      - name: Build (gpui — pin de SHA + runtime_shaders no macOS)
        run: cargo build
      - name: Test (gpui-free — tokens/WCAG, lifecycle de UI, criadores; lacuna escalada na F1-2-1)
        run: cargo test
      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Fmt
        run: cargo fmt -- --check
