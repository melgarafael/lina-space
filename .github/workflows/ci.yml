name: CI

# Esteira de qualidade do Lina Space (Fase 0 — Mac-first).
#
# O loop central da Fase 0 está PROVADO e validado na tela no macOS. Esta esteira
# trava a qualidade do core a cada push e faz o backup remoto do código.
#
# Estado dos gates (2026-06-03, HEAD da Onda 5):
#   * core-macos      — gate PRINCIPAL (espelha o canal limpo do Maestro): test + clippy + fmt.
#   * core-linux      — bônus barato; o core é Mac/Linux-verde (W0). Confirma portabilidade do core.
#   * core-windows    — portabilidade do core no Windows (x86_64-msvc). INFORMATIVO (continue-on-error)
#                       enquanto o caminho Windows do core nunca rodou num runner; depois do bring-up
#                       (W5-3) que liga o ConPTY, REMOVA o continue-on-error → vira gate de verdade.
#   * license-security — W5-5 wire-CI: cargo-deny (licenças) + cargo-audit (RustSec). Verdes localmente.
#   * app-macos       — build/clippy/fmt do shell gpui (standalone, fora do workspace).
#
# PENDENTE (bloco de INFRA do §7 — precisa hardware/certificados do fundador, NÃO ligado aqui):
#   * App gpui no Windows + ConPTY real (W5-3): bring-up nativo validado NA TELA — ver WINDOWS-BRINGUP.md.
#     (o core-windows acima cobre só o core headless; a tela do gpui não roda em CI — exige olho humano.)
#   * Matriz GPU Linux (NVIDIA/AMD/Intel × X11/Wayland) — ver épico W5-3.
#   * E2E visual golden-render 3-SO + assinatura/notarização (W5-6) → conta Apple + Authenticode.
# Ao primeiro push: confirme que os gates obrigatórios (core-macos, core-linux, license-security,
# app-macos) ficam verdes. O core-windows é informativo e NÃO bloqueia merge enquanto for continue-on-error
# (foram validados localmente, mas o ambiente do runner pode exigir ajuste de toolchain — em especial o gpui).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core-macos:
    name: Core (macOS) — gate principal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace, serializado — o store/recovery exige --test-threads=1)
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fmt (por-pacote — fmt --check no nível workspace mascara o exit; ver lição do projeto)
        run: |
          for c in lina-pty lina-vt lina-core lina-host lina-secrets lina-cli-profiles lina-role-discovery lina-bootstrap lina-webhooks; do
            cargo fmt -p "$c" -- --check
          done

  core-linux:
    name: Core (Linux) — portabilidade do core headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # keyring (lina-secrets) no Linux usa secret-service -> libdbus-sys (FFI), cujo build.rs aborta
      # sem as libs de sistema do D-Bus. macOS/Windows usam apple-native/windows-native (sem dbus).
      - name: Deps de sistema (D-Bus para o keyring/secret-service no Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace, serializado)
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  core-windows:
    name: Core (Windows) — portabilidade do core (x86_64-msvc)
    runs-on: windows-latest
    # INFORMATIVO até o bring-up ligar o ConPTY (ver WINDOWS-BRINGUP.md). PRÉ-bring-up este job só
    # COMPILA (não executa): vários testes de PTY-host spawnam comandos Unix (`yes`/`sh`) em terminais
    # reais e PENDURAM no Windows enquanto o ConPTY não está ligado (visto em CI: hang de ~70min no
    # teste flow_control_caps_memory_under_flood). `--no-run` valida o que dá pra provar hoje: que o
    # core (e os test binaries) COMPILA no Windows + clippy. PÓS-BRING-UP: troque `--no-run` por
    # `-- --test-threads=1` (passa a executar) e remova o `continue-on-error` → vira gate obrigatório.
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # windows-latest do GitHub é x86_64 → toolchain stable resolve x86_64-pc-windows-msvc
      # (exatamente a arquitetura exigida no bring-up). Não há fmt aqui: espelha core-linux.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build de testes (compila workspace + test binaries; NÃO executa — testes de PTY penduram pré-ConPTY)
        run: cargo test --workspace --no-run
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  license-security:
    name: Licença + Segurança (W5-5 wire-CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (licenças + bans + sources — usa deny.toml do repo)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit (RustSec — vulnerabilidades conhecidas)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  app-macos:
    name: App gpui (macOS) — shell standalone
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/lina-gpui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/lina-gpui
      - name: Build (gpui — pin de SHA + runtime_shaders no macOS)
        run: cargo build
      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Fmt
        run: cargo fmt -- --check
