[package]
name = "lina-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[dependencies]
# Windows usa vendor para permitir patch controlado dos flags ConPTY.
portable-pty = { path = "../../vendor/portable-pty" }
thiserror.workspace = true
tracing.workspace = true

# kill graceful (SIGTERM -> SIGKILL com timeout) no unix; Windows (TerminateProcess) na W5-3.
[target."cfg(unix)".dependencies]
libc = "0.2.186"
