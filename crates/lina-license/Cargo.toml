[package]
name = "lina-license"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verificação de assinatura da licença (F1-4-5). Só VERIFY no produto — a
# assinatura acontece exclusivamente no lina-keygen (máquina do fundador).
# ed25519-dalek é BSD-3-Clause (aprovada no deny.toml) e auditada (RustCrypto).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
