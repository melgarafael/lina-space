# default-roles.yaml — registry canônico de papéis do Lina Space (story W3-1).
#
# Fonte da verdade: vault "21 - Camada de IA e Orquestracao" §2.2, que estende
# `maestri-orchestrator/references/role-mapping.md` (mesmos patterns + os papéis
# novos CURADOR e AUTOMATOR). Este arquivo é EMBUTIDO no binário via include_str!
# — descoberta de papel é puro Rust, sem I/O nem rede em produção.
#
# Convenções:
#   * A ORDEM importa: "first match wins" (doc §2.1). Não reordene sem motivo.
#   * `patterns` são fragmentos REGEX (case-insensitive), SEM o marcador `@`
#     (o `@` é estrutural e tratado pelo matcher) e SEM âncoras (^ $ \b): o
#     matcher adiciona as âncoras conforme a estratégia (exato/prefixo/keyword).
#   * `needs_confirmation` omitido = false (papel declarado é confiável). Só o
#     fallback DEVELOPER nasce true: papel indeterminado pede gate humano
#     (postura "assistido" do doc §6).

fallback:
  role: DEVELOPER
  skills: [senior-frontend, senior-backend]
  needs_confirmation: true

roles:
  - role: MAESTRO
    patterns: [maestro, orquest, coord, lider, master]
    # BUG-2 dogfood r1: `maestri-orchestrator` é skill de orquestrador ESTRANGEIRO — o guard
    # do próprio Lina a bloqueia (pretooluse `is_foreign_skill`), e o bootstrap mandava o
    # MAESTRO carregá-la no turno 0 (instrução contraditória). A skill do papel é a
    # `lina-orchestration` (F1-3-4, o método Maestro internalizado na safra embutida).
    skills: [lina-orchestration]

  - role: ARQUITETO
    patterns: [arquiteto, architect, arch]
    skills: [senior-architect]

  - role: FRONTEND
    patterns: ["front.?end", "dev front", ui, react]
    skills: [senior-frontend, frontend-design, unique-ui-design]

  - role: BACKEND
    patterns: ["back.?end", "dev back", api, server, node]
    skills: [senior-backend, tomik-db-doctrine]

  - role: LLM_ENGINEER
    patterns: [ia, llm, prompt, agent]
    skills: [senior-prompt-engineer, ai-agent-qa]

  - role: DATA_ENGINEER
    patterns: [dados, db, database, sql, supabase]
    skills: [tomik-db-doctrine, agent-runtime-data-split]

  - role: UIUX_DESIGNER
    patterns: ["ui.?ux", ux, design]
    skills: [ui-ux-pro-max, ui-ux-auditor, unique-ui-design]

  - role: WRITER
    patterns: [writer, copy, redator, lp]
    skills: [growthOS-sales-page, social-content]

  - role: QA
    patterns: [qa, teste, quality]
    skills: [e2e-product-qa]

  - role: BUG_FIXER
    patterns: [bug, fixer, debug]
    skills: [autonomous-bug-fixer]

  - role: CURADOR
    patterns: [curador, tino, novidades, news, scout]
    skills: [tino-refresh, find-skills]

  - role: AUTOMATOR
    patterns: [automacao, webhook, gatilho, trigger, flow]
    skills: [mcp-builder]

  - role: TRADUTOR
    # F3-2-1 (doc-fonte linha 83; spec 52 §"Portas que NAO fecha"): o terminal que
    # INTERPRETA-PRIMEIRO — a porta de entrada humana do método. Recebe o pedido do
    # leigo, devolve "entendi X, vou fazer Y" ANTES de agir e propoe o time. E o origin
    # natural de `GoalDefined.origin = "@Tradutor"` (events.rs:591).
    #
    # REGRA-MAE (inv. de seguranca): o papel Tradutor e ROTULO DE PROVENIENCIA, JAMAIS
    # autoridade. Ter o papel nao concede permissao; a autenticacao em duas camadas segue
    # soberana. A DEGRADACAO (sem Tradutor no roster -> o Maestro assume a origem) e pura
    # em `entry_origin` (lib.rs) — rotulo, nunca credencial.
    #
    # POSICAO = ULTIMA (proposital): "interpretar-primeiro" e generico. Os aliases exatos
    # (Tradutor/@Tradutor/translator/interprete) resolvem por S1/S2 — independem da posicao.
    # Mas o keyword "interprete" (S3) e abrangente; por ULTIMO, os papeis ESPECIFICOS vencem
    # seu keyword primeiro ("backend interprete" -> BACKEND, nao TRADUTOR), e so um nome SEM
    # nenhum sinal especifico cai aqui. E o catch-all de interpretacao, acima do fallback.
    patterns: [tradutor, translator, interprete, interpreter]
    # F3-2 Camada 2: a doutrina da porta de entrada vem PRIMEIRO; orquestração como apoio.
    skills: [lina-translator, lina-orchestration]
