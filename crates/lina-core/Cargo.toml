[package]
name = "lina-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[dependencies]
lina-pty = { path = "../lina-pty" }
lina-vt = { path = "../lina-vt" }
lina-host = { path = "../lina-host" }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# W0-5: feature `serde` (aditiva) para serializar NodeId/UUID no payload dos eventos.
uuid = { workspace = true, features = ["serde"] }
# W0-4: pub/sub in-process do Workspace Bus (broadcast usável sem runtime: send + try_recv).
tokio = { version = "1", features = ["sync"] }
# W0-5/W0-6: event store (SQLite WAL, SQLite embutido via `bundled`) + JSONL/snapshots.
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# F1-0-3 (ADR 0019 §1): tail_hash do heartbeat = SHA-256 dos últimos ~80 chars do tail do PTY.
# Mesma versão já vendorizada na árvore (lina-webhooks) — zero churn de lockfile.
sha2 = "0.10"
regex = "1.12.3"
# W5-1: amostragem cross-platform de RSS do processo no benchmark de carga (bin bench_load).
sysinfo = "0.33"
lina-cli-profiles = { version = "0.0.1", path = "../lina-cli-profiles" }
# W3-6c (ADR 0004): o broker `lina do` lê o segredo custodiado do SecretVault (W0-7). Sem ciclo:
# lina-secrets depende só de thiserror/keyring/getrandom.
lina-secrets = { path = "../lina-secrets" }

# W3-7b (M3): `O_NOFOLLOW` no `File::open` do drain — fecha a janela symlink-swap pós-precheck
# (`symlink_metadata` → open). Só unix; não toca o build de outras plataformas.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "3.4.0"
# W4 (repro #22/#23): o teste de integração constrói um `GridSense` próprio (turno fechando)
# e precisa nomear `TermMode` no `impl` — não re-exportado pelo lina-core. Test-only, aditivo
# (lina-vt já é dependency normal acima; sem ciclo, sem churn de lockfile).
lina-vt = { path = "../lina-vt" }
# F1-1-6: o probe de latência REAL (examples/permission_probe.rs) consome o pipeline
# de hooks de verdade (HookListener do F1-1-3) + runtime tokio completo. DEV-only —
# nada disso entra no grafo de dependências da lib (sem ciclo: lina-hooks não depende
# de lina-core).
lina-hooks = { path = "../lina-hooks" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
