[package]
name = "lina-keygen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# Ferramenta do FUNDADOR (F1-4-7): emite chaves de licença em lote, offline.
# NUNCA entra no bundle do app — é binário separado, fora de qualquer release
# do Lina Space. A chave privada que ela usa vive fora do repo (OPERACAO.md).

[dependencies]
lina-license = { path = "../lina-license" }
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
