[package]
name = "spike-slint"
version = "0.0.1"
edition = "2021"
publish = false

# Spike W1-2 — Slint (release estável; a11y via AccessKit por feature flag). EXPERIMENTAL.
# Reusa o terminal real do core via path. NÃO é membro do workspace principal.
[dependencies]
lina-pty = { path = "../../crates/lina-pty" }
lina-vt = { path = "../../crates/lina-vt" }
# slint 1.16 estável. Features default já incluem: backend-default (winit),
# renderer-femtovg, renderer-software E `accessibility` (AccessKit) — ver RESULTADO.md.
slint = "1.16"
