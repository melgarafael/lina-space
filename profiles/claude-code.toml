# CLI Profile — Claude Code (Anthropic) · story W0-8
#
# Toda a especificidade deste CLI vive AQUI (TOML), nunca compilada no core
# (CLAUDE.md §Neutralidade multi-CLI). Trocar de CLI = trocar de profile.

# Identificador estável (chave no registry). Um profile custom de mesmo id
# (no diretório do usuário) sobrescreve este default.
id = "claude-code"

# Único ponto que conhece o binário. Args ficam aqui, fora do core.
program = "claude"
# Saída estruturada linha-a-linha (parse incremental no PTY vivo).
args = ["--output-format", "stream-json", "--verbose"]

# Entrega A2A faseada (CLAUDE.md §A2A): bracketed-paste -> submit_delay -> Enter
# (0x0D) enviado SEPARADO, em fila serial por terminal.
delivery = "pty_inject"
# F1-0-2: 300→400ms — margem extra entre a colagem e o Enter (a baseline observou o
# chip de paste-colapsado em alvo lento; faixa sugerida pela story: 400-500; validar
# na tela e ajustar AQUI, sem recompilar).
submit_delay_ms = 400

# Heurística "prompt pronto para receber input": uma linha começando com o glifo
# de prompt da TUI (> ou ❯). String literal TOML (aspas simples) p/ não escapar o
# regex. Compilação/validação do regex no load é incremento de W0-9.
# F1-0-2: o regex é avaliado sobre a REGIÃO DE INPUT do grid (da última linha-prompt
# ao fim), nunca só sobre a última linha (que na TUI do Claude Code é o rodapé).
prompt_ready_regex = '(?m)^\s*[>❯]\s'

# F1-0-2: orçamento do wait_ready da entrega A2A. Timeout -> NÃO injeta (erro explícito;
# era o "injeta mesmo assim" que produzia o texto-colado 18/20 da baseline). Calibrado
# contra os bursts reais observados na baseline ("Cogitated for 9s") com margem ~3x.
ready_timeout_ms = 30000

# F1-0-2: marcadores de OCUPADO na região de input — a TUI mostra `❯ ` o tempo todo
# (até com mensagem enfileirada), então o glifo sozinho NÃO é prontidão. Extraídos dos
# grids REAIS capturados pela baseline (baseline-artifacts/grids/stuck-11/15.txt).
busy_markers = ["esc to interrupt", "Press up to edit queued messages"]

# Janela de quietude (ms) p/ heurística de idle e timeout do `ask` A2A (W0-9/W0-10).
# NOTA (F1-1-1): estas chaves são TOP-LEVEL e por isso vivem ANTES de [end_signal] —
# depois da tabela elas viram chaves DE end_signal e são ignoradas silenciosamente
# (bug de posicionamento corrigido nesta story).
idle_ms = 1500
ask_timeout_ms = 120000

# ── F1-1-1 (pesquisa 13.9 item 1): assinatura completa do CLI ──

# Onde este CLI grava session-files (camada 3 de detecção/observabilidade — F1-1-2).
session_dir_pattern = "~/.claude/projects/*/*.jsonl"

# Assinaturas no output do grid (telemetria camada 4 — NUNCA decisória; ADR de detecção).
output_markers = ['"type":"result"', "✻ Welcome to Claude"]

# O que este CLI emite/suporta (consumido por F1-1-2/3/6/9 e guards por CLI).
# Mapa aberto: capability nova entra por TOML, sem recompilar (invariante #3).
[capabilities]
hooks = true                # settings.json hooks (PreToolUse, Notification, …)
otel = true                 # exporta OTel (F1-1-4)
permission_detection = true # prompt de permissão detectável (hook Notification)
handoff_support = true      # aceita envelope A2A completo c/ --await (13.9 item 5)

# Fim-de-resposta (consumido por W0-10): no modo stream-json o Claude Code encerra
# a resposta com uma linha JSON de tipo "result" ({"type":"result","subtype":...}).
[end_signal]
kind = "stream_json"
event_type = "result"
